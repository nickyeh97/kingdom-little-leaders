name: CI

on:
  push:
    branches: [main, dev, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安裝依賴
        run: npm ci
      - name: 型別檢查與建置
        run: npm run build
      - name: 單元與邊際測試
        run: npm test
